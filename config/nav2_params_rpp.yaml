# ==================================================================================
# nav2_params.yaml for a VSLAM-based Robot Mower
#
# Hardware: RPLIDAR S2, RealSense D435i
# Software: ROS 2 Humble, Nav2, RTAB-Map
# Key Features:
# - No wheel encoders (relies on visual odometry)
# - Designed for straight-line waypoint following (mowing)
# - Uses 3D depth camera for robust obstacle avoidance on uneven terrain
# ==================================================================================

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom          # Local costmap operates in the odom frame
      robot_base_frame: base_footprint # The robot's base frame
      # --- Sizing & Update Rate ---
      # A 5x5 meter window around the robot, updated frequently for obstacle avoidance
      width: 8
      height: 8
      resolution: 0.05
      update_frequency: 6.0
      publish_frequency: 3.0
      transform_tolerance: 0.4
      rolling_window: true        # The costmap moves with the robot
      # --- Plugins (Layers) ---
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_range: 2.5
          raytrace_range: 3.0
      # voxel_layer:
      #   plugin: "nav2_costmap_2d::VoxelLayer"
      #   enabled: true
      #   publish_voxel_map: true
      #   origin_z: 0.0
      #   z_resolution: 0.05
      #   z_voxels: 16
      #   max_obstacle_height: 1.5
      #   observation_sources: pointcloud
      #   pointcloud:
      #     topic: /camera/depth/color/points
      #     data_type: "PointCloud2"
      #     max_obstacle_height: 1.5
      #     min_obstacle_height: 0.25   # Ignore obstacles very close to the ground
      #     obstacle_range: 2.5
      #     raytrace_range: 3.0
      #     marking: true
      #     clearing: true
      # --- Inflation Layer ---
      # Adds a safety buffer around all obstacles
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 2.0
        inflation_radius: 0.5      # Buffer distance in meters. Tune this based on performance.
      # --- Footprint ---
      footprint: "[[1.07, 0.54], [1.07, -0.54], [-0.16, -0.54], [-0.16, 0.54]]"

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map           # Global costmap operates in the map frame
      robot_base_frame: base_footprint
      use_sim_time: false
      # --- Sizing & Update Rate ---
      # Slower update rate as this map changes less frequently
      update_frequency: 5.0
      publish_frequency: 1.0
      transform_tolerance: 0.4
      # --- Plugins (Layers) ---
      # The order is: Static -> Obstacle -> Inflation
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # --- Static Layer ---
      # Uses the map generated by RTAB-Map
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
      # --- Obstacle Layer (for 2D LiDAR) ---
      # Adds obstacles from the LiDAR to the global map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
      # --- Inflation Layer ---
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 2.0
        inflation_radius: 0.5
      # --- Footprint ---
      # Using the same footprint as the local costmap
      footprint: "[[1.07, 0.54], [1.07, -0.54], [-0.16, -0.54], [-0.16, 0.54]]"

# ==================================================================================
# Server Configurations
# ==================================================================================

# --- Planner Server (Global Planner) ---
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_straightline_planner/StraightLine"
      interpolation_resolution: 0.1

# --- Controller Server (Local Planner) ---
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    transform_tolerance: 0.4
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.3
    # Using the RPP controller
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      lookahead_dist: 1.2
      min_lookahead_dist: 1.2
      max_lookahead_dist: 3.5
      lookahead_time: 1.5
      desired_linear_vel: 0.6
      use_velocity_scaled_lookahead_dist: true
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 1.5
      cost_scaling_gain: 2.0
      use_collision_detection: true
      use_rotate_to_heading: false
      min_approach_linear_velocity: 0.4
      approach_velocity_scaling_dist: 2.0
      allow_reversing: false

behavior_server:
  ros__parameters:
    use_sim_time: False
    robot_base_frame: base_footprint
    transform_tolerance: 0.4
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

