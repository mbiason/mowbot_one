# ==================================================================================
# nav2_params.yaml for a VSLAM-based Robot Mower
#
# Hardware: RPLIDAR S2, RealSense D435i
# Software: ROS 2 Humble, Nav2, RTAB-Map
# Key Features:
# - No wheel encoders (relies on visual odometry)
# - Designed for straight-line waypoint following (mowing)
# - Uses 3D depth camera for robust obstacle avoidance on uneven terrain
# ==================================================================================

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom          # Local costmap operates in the odom frame
      robot_base_frame: base_footprint # The robot's base frame
      # --- Sizing & Update Rate ---
      # A 5x5 meter window around the robot, updated frequently for obstacle avoidance
      width: 5
      height: 5
      resolution: 0.05
      update_frequency: 6.0
      publish_frequency: 3.0
      transform_tolerance: 0.2
      rolling_window: true        # The costmap moves with the robot
      # --- Plugins (Layers) ---
      # The order is: Voxel -> Inflation
      plugins: ["voxel_layer", "inflation_layer"]
      # --- Voxel Layer (for 3D obstacles from D435i) ---
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_unknown_space: false
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/depth/color/points
          data_type: "PointCloud2"
          max_obstacle_height: 1.5
          min_obstacle_height: 0.15   # Ignore obstacles very close to the ground
          obstacle_range: 2.5
          raytrace_range: 3.0
          marking: true
          clearing: true
      # --- Inflation Layer ---
      # Adds a safety buffer around all obstacles
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 4.0
        inflation_radius: 0.7      # Buffer distance in meters. Tune this based on performance.
      # --- Footprint ---
      # IMPORTANT: Defined in the global_costmap section and used by both.
      robot_radius: 0.48 # Fallback if footprint is not set
      footprint: "[[1.07, 0.48], [1.07, -0.48], [-0.16, -0.48], [-0.16, 0.48]]" # Based on your dimensions

global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map           # Global costmap operates in the map frame
      robot_base_frame: base_footprint
      use_sim_time: false
      # --- Sizing & Update Rate ---
      # Slower update rate as this map changes less frequently
      update_frequency: 5.0
      publish_frequency: 1.0
      # --- Plugins (Layers) ---
      # The order is: Static -> Obstacle -> Inflation
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # --- Static Layer ---
      # Uses the map generated by RTAB-Map
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_subscribe_transient_local: true
      # --- Obstacle Layer (for 2D LiDAR) ---
      # Adds obstacles from the LiDAR to the global map
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
      # --- Inflation Layer ---
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 4.0
        inflation_radius: 0.7
      # --- Footprint ---
      # Using the same footprint as the local costmap
      robot_radius: 0.48
      footprint: "[[1.07, 0.48], [1.07, -0.48], [-0.16, -0.48], [-0.16, 0.48]]"

# ==================================================================================
# Server Configurations
# ==================================================================================

# --- Planner Server (Global Planner) ---
planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_straightline_planner/StraightLine"
      interpolation_resolution: 0.1

# --- Controller Server (Local Planner) ---
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.1
    # Using the RPP controller
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      # ======== Robot Motion Limits ========
      # Set these to the safe operational limits of your physical robot.
      # For a large mower, it's better to start slow and increase later.
      vx_max: 0.7                  # Max linear velocity (m/s). A slower speed allows for more accurate tracking.
      vy_max: 0.0                  # Max strafing velocity (m/s). Should be 0.0 for a differential drive robot.
      wz_max: 1.0                  # Max angular velocity (rad/s). This should be a comfortable turning speed.
      vx_min: 0.1                  # Min linear velocity when moving forward (m/s). Prevents stopping unexpectedly on a path.

      # ======== Prediction Settings ========
      # These parameters define the behavior of the predictive planner.
      time_steps: 40               # Number of simulation steps in the future. A higher value gives a longer horizon, which is good for a large robot to plan smoother, more deliberate actions.
      model_dt: 0.05               # Time step duration (s). `time_steps * model_dt` is the total prediction time (2.0s here).
      iteration_count: 1           # Number of optimization iterations. 1 is usually sufficient.
      batch_size: 1000             # Number of trajectories to sample in each iteration. Higher values explore more options but use more CPU. 1000 is a reasonable default.
      temperature: 0.3             # Optimization parameter. Controls how the best trajectories are weighted.
      gamma: 0.015                 # Optimization parameter. Controls the noise injection for exploration.
      motion_model: "DiffDrive"    # The motion model to use. "DiffDrive" is correct for your robot.
      transform_tolerance: 0.2     # Time (s) to wait for TF transforms.

      # ======== Critic Settings ========
      # This is the most important section for tuning behavior.
      # The "weight" determines the priority of each behavior. Higher weight = more important.
      critics:
        - GoalCritic         # Encourages reaching the goal.
        - CostCritic         # Penalizes trajectories that are close to or in obstacles.
        - PathAlignCritic    # The most important critic for your use-case. Keeps the robot tightly on the path.
        - PathFollowCritic   # Penalizes moving in the wrong direction along the path.
        - TwirlingCritic     # Penalizes excessive rotation.
      # --- Critic-Specific Parameters ---
      GoalCritic:
        weight: 25.0         # High weight to prioritize precise goal attainment.
        dist_scale: 0.5      # Scales the distance cost.
        angle_scale: 1.0     # Scales the orientation cost.
      CostCritic:
        weight: 5.0          # Moderate weight. Assumes you have a good global path, but still critical for safety.
        critical_cost: 100.0 # Cost value at which a trajectory is considered invalid (in collision).
      PathAlignCritic:
        weight: 40.0         # VERY HIGH WEIGHT. This is the key to minimizing cross-track error and keeping your large mower perfectly on its lines. It punishes any deviation from the global path.
        max_path_occupancy_ratio: 0.07 # Must match the global `max_path_occupancy_ratio`.
        offset_from_furthest: 20 # Number of points along the path to sample for alignment.
      PathFollowCritic:
        weight: 15.0         # High weight to ensure the robot doesn't try to go backward on the path.
      TwirlingCritic:
        weight: 15.0         # High weight to prevent the large robot from making unnecessary, oscillatory spins.

behavior_server:
  ros__parameters:
    use_sim_time: False
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 1
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_w_recovery_and_replanning_only_if_path_becomes_invalid.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# --- Waypoint Follower ---
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 1.0]
    min_velocity: [-1.0, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
